<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino & Raspberry Pi Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Updated Theme: Raspberry Red & Charcoal */
            --primary: #A6192E; 
            --primary-dark: #7D1224;
            --accent: #6CC24A; 
            --bg-dark: #1a1a2e;
            --bg-light: #f5f5f5;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --success: #6CC24A;
            --warning: #fdcb6e;
            --danger: #d63031;
            --led-red: #ff0000;
            --wire-color: #FF9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: linear-gradient(135deg, #A6192E 0%, #2d3436 100%);
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1920px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 32px; height: 32px; background: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 700; }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        .component-palette {
            width: 280px;
            background: #f8f9fa;
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
        }

        .category-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 15px 0 10px 0;
        }

        .palette-component {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.3s;
        }

        .palette-component:hover { border-color: var(--primary); transform: translateY(-2px); }

        .canvas-area { flex: 1; position: relative; background: #fafbfc; }
        .workspace { width: 100%; height: 100%; position: relative; overflow: hidden; }
        
        #simulatorCanvas { width: 100%; height: 100%; background: radial-gradient(#e5e5f7 0.5px, transparent 0.5px); background-size: 20px 20px; }

        /* Board Styles */
        .canvas-component { position: absolute; background: white; border: 2px solid #333; border-radius: 4px; cursor: move; user-select: none; }
        
        .arduino-board { width: 400px; padding: 15px; background: #00979C; color: white; }
        
        .raspberry-pi-board { width: 450px; padding: 20px; background: #004225; color: white; border-radius: 12px; }
        .pi-gpio-header { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; background: #333; padding: 5px; border-radius: 4px; margin: 10px 0; }
        .pi-pin { width: 10px; height: 10px; background: #FFD700; border-radius: 2px; cursor: pointer; }
        .pi-pin.connected { background: var(--accent); }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-start { background: var(--success); color: white; }
        .btn-stop { background: var(--danger); color: white; margin-left: 8px; }

        .wire-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo"><div class="logo-icon">π</div><span>Hardware Simulator</span></div>
            <div class="controls">
                <button class="btn btn-start" id="startBtn">▶ Start</button>
                <button class="btn btn-stop" id="stopBtn" disabled>⏹ Stop</button>
            </div>
        </div>

        <div class="main-content">
            <div class="component-palette">
                <div class="category-title">Microcontrollers</div>
                <div class="palette-component" draggable="true" data-type="arduino">Arduino Uno</div>
                
                <div class="category-title">Microcomputers</div>
                <div class="palette-component" draggable="true" data-type="rpi5">Raspberry Pi 5</div>
                <div class="palette-component" draggable="true" data-type="rpi4">Raspberry Pi 4B</div>
                <div class="palette-component" draggable="true" data-type="rpizero">Pi Zero 2 W</div>

                <div class="category-title">Components</div>
                <div class="palette-component" draggable="true" data-type="led">LED</div>
                <div class="palette-component" draggable="true" data-type="button">Push Button</div>
            </div>

            <div class="canvas-area">
                <div class="workspace" id="workspace">
                    <svg class="wire-svg" id="wireSvg"></svg>
                    <canvas id="simulatorCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = {
            components: [],
            wires: [],
            isDragging: false,
            selectedComponent: null,
            nextId: 1
        };

        class Component {
            constructor(type, x, y) {
                this.id = state.nextId++;
                this.type = type;
                this.x = x;
                this.y = y;
                this.element = this.createDOM();
            }

            createDOM() {
                const div = document.createElement('div');
                div.className = 'canvas-component';
                div.style.left = this.x + 'px';
                div.style.top = this.y + 'px';
                
                if (this.type === 'arduino') {
                    div.className += ' arduino-board';
                    div.innerHTML = `<strong>Arduino Uno</strong><div style="margin-top:10px">Digital Pins 2-13</div>`;
                } else if (this.type.startsWith('rpi')) {
                    div.className += ' raspberry-pi-board';
                    const models = { rpi5: 'Raspberry Pi 5', rpi4: 'Pi 4 Model B', rpizero: 'Pi Zero 2 W' };
                    div.innerHTML = `
                        <strong>${models[this.type]}</strong>
                        <div class="pi-gpio-header">
                            ${Array(40).fill(0).map((_, i) => `<div class="pi-pin" title="GPIO ${i}"></div>`).join('')}
                        </div>
                    `;
                } else {
                    div.style.padding = '10px';
                    div.innerHTML = this.type.toUpperCase();
                }

                div.addEventListener('mousedown', (e) => {
                    state.isDragging = true;
                    state.selectedComponent = this;
                });

                document.getElementById('workspace').appendChild(div);
                return div;
            }
        }

        // Initialize Canvas & Drag-Drop
        const workspace = document.getElementById('workspace');
        
        workspace.addEventListener('dragover', (e) => e.preventDefault());
        workspace.addEventListener('drop', (e) => {
            const type = e.dataTransfer.getData('text');
            const rect = workspace.getBoundingClientRect();
            new Component(type, e.clientX - rect.left - 50, e.clientY - rect.top - 50);
        });

        document.querySelectorAll('.palette-component').forEach(comp => {
            comp.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text', comp.dataset.type);
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (state.isDragging && state.selectedComponent) {
                const rect = workspace.getBoundingClientRect();
                state.selectedComponent.x = e.clientX - rect.left - 50;
                state.selectedComponent.y = e.clientY - rect.top - 50;
                state.selectedComponent.element.style.left = state.selectedComponent.x + 'px';
                state.selectedComponent.element.style.top = state.selectedComponent.y + 'px';
            }
        });

        document.addEventListener('mouseup', () => state.isDragging = false);

    </script>
</body>
</html>
